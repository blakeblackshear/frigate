axelera:
  title: Axelera Metis
  models:
    - key: yolox
      label: YOLOX
      recommended: true
      download: |-
        Axelera models must be compiled for the Metis NPU with the Voyager SDK before Frigate can run them (compilation is not supported inside the container). Compile a model with the SDK, place the compiled output directory under `/config`, and point the model's `path` at it. The default recommendation is the Apache-2.0 licensed YOLOX (Megvii YOLOX, e.g. the `yolox-s-coco-onnx` model-zoo network).
      ui: |-
        Navigate to **Settings > System > Detection models** and select **Axelera Metis** from the **Hardware** dropdown. Then, on the same model, open the **Custom Model** tab and configure:

        | Field                                    | Value                                                        |
        | ---------------------------------------- | ------------------------------------------------------------ |
        | **Custom object detector model path**    | `/config/model_cache/axelera/yolox-s-coco-onnx`              |
        | **Label map for custom object detector** | `/labelmap/coco-80.txt`                                      |
        | **Object detection model input width**   | `640` (the compiled input size)                            |
        | **Object detection model input height**  | `640`                                                      |
        | **Model Input Pixel Color Format**       | `bgr` (Frigate delivers BGR; the plugin hands RGB planes to the compiled input) |
        | **Model Input Tensor Shape**             | `nhwc` (Frigate's default value)                             |
        | **Model Input D Type**                   | `int` (Frigate's default value)                              |
        | **Object Detection Model Type**          | `yolox`                                                      |
      yaml: |-
        models:
          - devices:
              - axelera:PCIe
            path: /config/model_cache/axelera/yolox-s-coco-onnx
            model_type: yolox
            width: 640
            height: 640
            input_pixel_format: bgr
            labelmap_path: /labelmap/coco-80.txt
